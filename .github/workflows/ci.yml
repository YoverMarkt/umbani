# ── CI de BotPanel ────────────────────────────────────────────────────
# Corre en cada push/PR: sintaxis + lint + tipos + Vitest + builds + E2E.
# NO necesita secretos: Playwright intercepta las APIs y no usa la BD.
# Si esto está en rojo, NO se mergea (barandilla de la migración).
# Monorepo con npm workspaces: UN solo lockfile en la raíz, npm ci instala todo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ejecución a mano desde `gh workflow run CI --ref <rama>`. Existe para las
  # auditorías: `verify:schema` necesita Docker y en la máquina del dueño no
  # está, así que la única forma de correr el esquema contra PostgreSQL real es
  # aquí. Sin esto había que abrir un PR de mentira para lanzar el CI.
  workflow_dispatch:

jobs:
  verificar:
    name: Lint + Tipos + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias (workspaces)
        run: npm ci

      - name: Lint del servidor TypeScript y pruebas
        run: npm run lint -w @botpanel/server

      - name: Tipos del servidor TypeScript
        run: npm run typecheck -w @botpanel/server

      # Con umbrales de cobertura, así que además de pasar los tests avisa si
      # una zona del servidor deja de estar probada. El umbral está por DEBAJO
      # de lo medido: existe para que no retroceda, no para exigir una cifra.
      - name: Tests del servidor (con cobertura)
        run: npm run test:coverage -w @botpanel/server

      # Código muerto en todo el monorepo. Vivía SOLO en `npm run check` de la
      # raíz, que el CI nunca llama — el mismo agujero que tuvo
      # `verificar-fronteras.sql` hasta el 2026-08-02: un guardián que funciona
      # pero que depende de que alguien se acuerde de correrlo no es un
      # guardián. No hay hooks de git, así que nada lo lanzaba solo.
      #
      # Acotado a lo que knip puede ver de verdad: los exports del servidor los
      # vigila `exports-huerfanos.test.js`, porque el patrón `require()` tipado
      # de este proyecto no lo rastrea ninguna herramienta genérica (en su
      # primera pasada marcó 71 falsos positivos).
      - name: Código muerto (knip)
        run: npx knip --no-progress

      # Que knip corra no significa que knip vea. Se planta un archivo huérfano
      # y se exige que lo cace, igual que se hace con el esquema roto.
      - name: Comprobar que knip detecta código muerto
        run: |
          cat > server/src/services/comprobacion-knip.ts <<'FIN'
          export const nadieMeLlama = (): string => 'huérfano'
          FIN
          if npx knip --no-progress > /dev/null 2>&1; then
            rm -f server/src/services/comprobacion-knip.ts
            echo "❌ knip pasó con un archivo huérfano: ya no detecta nada"
            exit 1
          fi
          rm -f server/src/services/comprobacion-knip.ts
          echo "✅ knip detecta correctamente el código muerto"

  # Aplica el esquema a un PostgreSQL de verdad y EJECUTA sus funciones. Es la
  # única forma de detectar la familia de fallos que tumbó el canal cinco días en
  # julio de 2026: PostgreSQL no valida el cuerpo de una función plpgsql al
  # crearla, así que una migración puede aplicarse "con éxito" y reventar en el
  # primer uso real. Los demás tests leen el SQL; este lo corre.
  esquema:
    name: Esquema contra PostgreSQL real
    runs-on: ubuntu-latest
    services:
      postgres:
        # Misma extensión pgvector que usa Supabase para el RAG del catálogo.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: botpanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -d botpanel -v ON_ERROR_STOP=1
    steps:
      - uses: actions/checkout@v7

      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Emular el entorno de Supabase
        run: $PSQL -q -f server/tests/sql/bootstrap-supabase.sql

      - name: Aplicar schema.sql en una base vacía
        run: $PSQL -q -f server/schema.sql

      - name: Ejecutar las funciones críticas
        run: $PSQL -f server/tests/sql/verificar-esquema.sql

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Aplicar las plantillas REALES del alta
        # El alta se traga a propósito el error de la plantilla (el negocio ya
        # existe y no puede devolver un 500), así que una plantilla que la base
        # rechace deja al local naciendo VACÍO sin que nada falle. Esto aplica
        # cada plantilla de `business-templates.ts` —no una copia— y se deshace.
        # Lee el TypeScript sin compilar: no hace falta `npm ci` aquí.
        run: |
          node --no-warnings server/tests/sql/plantillas-reales.mjs > plantillas-reales.sql
          $PSQL -f plantillas-reales.sql

      - name: Comprobar el aislamiento entre negocios
        # Regla #1 del proyecto: un negocio jamás ve ni toca los datos de otro.
        # Se prueba con DOS negocios reales conviviendo en la misma base.
        run: $PSQL -f server/tests/sql/verificar-aislamiento.sql

      - name: Buscar fronteras entre negocios sin cerrar
        # Este guardián SOLO corría en local con Docker (`npm run verify:schema`)
        # y por eso el CI estuvo verde el 2026-08-02 mientras se abrían cuatro
        # fronteras: las foráneas de `sales` hacia pedidos, citas y estadías
        # comprobaban que la fila existiera, no de quién era. Un guardián que
        # depende de que alguien se acuerde de correrlo no es un guardián.
        run: $PSQL -f server/tests/sql/verificar-fronteras.sql

      - name: Comprobar que la verificación detecta un esquema roto
        # Sin esto, la verificación podría quedarse en verde para siempre aunque
        # dejara de comprobar nada. Se reintroduce el fallo real de julio de 2026
        # y se exige que salte.
        run: |
          $PSQL -q -c "alter function public.record_inbound_message_usage() set search_path = public, pg_temp;"
          if $PSQL -q -f server/tests/sql/verificar-esquema.sql > /dev/null 2>&1; then
            echo "❌ La verificación pasó con el esquema roto: ya no detecta nada"
            exit 1
          fi
          echo "✅ La verificación detecta correctamente el esquema roto"

  panel-react:
    name: Panel cliente (React + TS) — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias (workspaces)
        run: npm ci

      - name: Lint del panel cliente y UI compartida
        run: npm run lint -w @botpanel/ui && npm run lint -w @botpanel/client

      # ⚠️ Sin este paso las pruebas del panel existían y el CI no las corría:
      # salía verde precisamente porque no las miraba (2026-09-14).
      - name: Tests del panel cliente
        run: npm test -w @botpanel/client

      - name: Type-check + build (tsc + vite)
        run: npm run build -w @botpanel/client

  panel-admin:
    name: Panel admin (React + TS) — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias (workspaces)
        run: npm ci

      - name: Lint del panel admin y UI compartida
        run: npm run lint -w @botpanel/admin

      - name: Tests del panel admin
        run: npm test -w @botpanel/admin

      - name: Type-check + build (tsc + vite)
        run: npm run build -w @botpanel/admin

      # El panel de las cooperativas (2026-10-06) va en ESTE trabajo y no en
      # uno propio: `main` exige siete revisiones por su nombre, y un octavo
      # trabajo no lo exigiría nadie. Aquí, si falla, falla esta revisión.
      - name: Panel de la cooperativa — lint, tests y build
        run: |
          npm run lint -w @botpanel/cooperativa
          npm test -w @botpanel/cooperativa
          npm run build -w @botpanel/cooperativa

  mini-app:
    name: Mini app de la tienda (React + TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias (workspaces)
        run: npm ci

      - name: Lint de la mini app
        run: npm run lint -w @botpanel/store

      # El carrito es lo único de la app con lógica propia, y decide el número
      # que ve el cliente antes de confirmar.
      - name: Tests del carrito
        run: npm test -w @botpanel/store

      - name: Type-check + build (tsc + vite)
        run: npm run build -w @botpanel/store

      # Esta app la abre el cliente final desde WhatsApp, con datos móviles.
      # Va sin router y sin cliente de datos a propósito, y eso lo deshace un
      # `import` distraído que nadie nota revisando un diff.
      - name: Presupuesto de tamaño
        run: npm run size -w @botpanel/store

  e2e:
    name: Flujos E2E (Chromium)
    runs-on: ubuntu-latest
    needs: [panel-react, panel-admin]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Probar login, navegación y responsive
        run: npm run test:e2e

  # ── Los recorridos de punta a punta (2026-10-01) ──────────────────────
  # Todo lo de arriba prueba PIEZAS: Vitest las rutas con la base simulada,
  # `esquema` las funciones SQL una a una. Esto arranca el servidor de verdad
  # contra un Supabase de verdad (el mismo del staging local) y recorre un
  # pedido ENTERO como lo vive la gente: pedir, pagar en efectivo, por
  # transferencia o con tarjeta, cancelar, devolver, entregar y liquidar el
  # lunes, comprobando el dinero al centavo. PayPhone y WhatsApp son falsos
  # (`tests/recorridos/proveedores-falsos.mjs`): no sale nada a internet.
  # Ver VERIFICACION.md → «Los recorridos de punta a punta».
  recorridos:
    name: Recorridos de punta a punta (servidor + Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias (workspaces)
        run: npm ci

      # El staging siembra con `psql`. En Linux el contenedor no conoce
      # `host.docker.internal` (solo existe en Docker Desktop): con el cliente
      # instalado, `staging.mjs` lo usa directamente.
      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # La base, PostgREST y su pasarela: el servidor habla con la base por
      # HTTP y no usa nada más (Auth, Storage y Realtime ya van apagados en
      # supabase/config.toml).
      # ⚠️ `edge-runtime` NO se excluye aunque no se use: con Auth apagado,
      # `supabase status` no enseña las claves, y la de servicio solo queda
      # escrita en el archivo de arranque de ESE contenedor
      # (`supabase/.temp/start-secrets/…/docker.env`), que es de donde la lee
      # `staging.mjs`. Excluirlo dejó al primer CI sin clave (2026-10-01).
      - name: Levantar Supabase (base + API)
        run: supabase start -x studio,postgres-meta,logflare,vector,imgproxy,supavisor,mailpit

      - name: Recorrer los pedidos de punta a punta
        run: npm run test:recorridos -w @botpanel/server

      - name: Registro del servidor (si falló)
        if: failure()
        run: cat /tmp/umbani-recorridos-servidor.log || true
