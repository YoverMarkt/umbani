name: Vigía de producción

# ⚠️ Este workflow avisa FALLANDO: cuando termina en rojo, GitHub manda el
# correo y el aviso a la app móvil. No hay ningún envío que mantener.
#
# Toda la lógica —incluido cuándo callarse para no mandar 96 correos al día—
# vive en `.github/scripts/vigia.mjs`, que está probado en
# `server/tests/vigia.test.js`. Aquí solo se decide cada cuánto mirar.
#
# ⚠️ Este mira SOLO si el bot está vivo (`VIGIA_MODO: caida`). El saldo, las
# credenciales, el canario y el canal mudo son de `vigia-atencion.yml`, y están
# separados a propósito: los dos workflows comparten el script pero NO la
# memoria, y compartirla dejaba que una alarma crónica —el saldo de YCloud en
# 0,50 USD— se tragara el hueco de silencio de una caída de verdad.

on:
  schedule:
    # Cada 15 minutos. GitHub retrasa los cron en horas punta y no los garantiza
    # al minuto; para enterarse de una caída, unos minutos de más dan igual.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Solo mira. Necesita `actions: read` para consultar su propia ejecución
# anterior, que es toda la memoria que tiene.
permissions:
  contents: read
  actions: read

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  mirar:
    name: ¿Sigue viva la producción?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Preguntar a producción
        env:
          VIGIA_MODO: caida
          # La URL real de Railway. `vars.PRODUCTION_URL` la sustituye sin tocar
          # este archivo el día que haya dominio propio.
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://web-production-3433c.up.railway.app' }}
          # Opcional: sin él, el vigía sigue viendo si el bot vive y si entran
          # mensajes, pero no el saldo ni las credenciales.
          HEALTH_DETAIL_TOKEN: ${{ secrets.HEALTH_DETAIL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/vigia.mjs
